apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
# 배포할 버전. 인프라 레포의 CI가 main 푸시마다 이 줄만 바꿔 커밋하고, Argo CD가 그 커밋을 클러스터에 맞춘다.
# 태그를 overlay가 아니라 여기 두는 이유: Argo CD가 overlay에서 이미지 이름(ECR 주소)을 덮어쓸 때
# 같은 층의 태그를 지운다. 층이 다르면 태그가 남는다 (README 참고).
images:
  - name: app
    newTag: "aa6c050" # 따옴표 필수. 1234567 같은 해시를 YAML이 숫자로 읽는다
