apiVersion: v1
kind: Service
metadata:
  name: saa-notes
  labels: { app: saa-notes } # ServiceMonitor가 이 라벨로 Service를 찾는다
spec:
  selector: { app: saa-notes }
  ports:
    - { name: http, port: 80, targetPort: http } # Ingress(ALB)가 쓰는 포트
    - { name: metrics, port: 8081, targetPort: metrics } # 클러스터 안의 Prometheus만 쓴다
